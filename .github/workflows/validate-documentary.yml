name: Validate documentary changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [documentary-scene-matching]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile autopilot.py resilient_runner.py
      - name: Test narration-to-scene planning
        run: python -m unittest discover -s tests -v
