name: Autopilot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      force_format:
        description: "short, long, or leave blank for automatic"
        required: false
        default: ""
      report_only:
        description: "true = only send the performance report"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure ffmpeg and fonts
        run: |
          needs_install=false
          command -v ffmpeg >/dev/null 2>&1 || needs_install=true
          if ! command -v fc-match >/dev/null 2>&1 || ! fc-match "DejaVu Sans" | grep -qi "DejaVu Sans"; then
            needs_install=true
          fi
          if [ "$needs_install" = true ]; then
            timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            timeout 180s sudo apt-get -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
          fc-match "DejaVu Sans"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile autopilot.py resilient_runner.py preflight.py record_workflow.py

      - name: Run automated unit tests
        run: python -m unittest discover -s tests -v

      - name: Check platform configuration
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ENABLE_YOUTUBE_UPLOAD: ${{ vars.ENABLE_YOUTUBE_UPLOAD }}
          ENABLE_FACEBOOK_PUBLISH: ${{ vars.ENABLE_FACEBOOK_PUBLISH }}
          ENABLE_INSTAGRAM_PUBLISH: ${{ vars.ENABLE_INSTAGRAM_PUBLISH }}
          ENABLE_TIKTOK_UPLOAD: ${{ vars.ENABLE_TIKTOK_UPLOAD }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python preflight.py

      - name: Run autopilot
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          GEMINI_TIMEOUT_SECONDS: ${{ vars.GEMINI_TIMEOUT_SECONDS }}
          GEMINI_ATTEMPTS_PER_MODEL: ${{ vars.GEMINI_ATTEMPTS_PER_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ENABLE_YOUTUBE_UPLOAD: ${{ vars.ENABLE_YOUTUBE_UPLOAD }}
          ENABLE_FACEBOOK_PUBLISH: ${{ vars.ENABLE_FACEBOOK_PUBLISH }}
          ENABLE_INSTAGRAM_PUBLISH: ${{ vars.ENABLE_INSTAGRAM_PUBLISH }}
          ENABLE_TIKTOK_UPLOAD: ${{ vars.ENABLE_TIKTOK_UPLOAD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_DAILY_UPLOADS: ${{ vars.YOUTUBE_DAILY_UPLOADS }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          REPORT_HOUR_UTC: ${{ vars.REPORT_HOUR_UTC }}
          FORCE_FORMAT: ${{ github.event.inputs.force_format }}
          REPORT_ONLY: ${{ github.event.inputs.report_only }}
        run: python resilient_runner.py

      - name: Keep the video for 2 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-video
          path: work/final_*.mp4
          retention-days: 2
          if-no-files-found: ignore

      - name: Save history
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python record_workflow.py
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git pull --rebase && git push)
